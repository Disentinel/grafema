# commander (v13.x) — CLI framework
# Generated: 2026-03-15
# Method: Grafema graph analysis + Claude inference, cross-validated
# Taxonomy version: 1
# purl: pkg:npm/commander
#
# Graph validation findings (7599 nodes, 18285 edges):
#   - 3x process.exit calls → IO, THROW (in _exit, error handling)
#   - 2x childProcess.spawn calls → IO, ASYNC (executableSubcommand support)
#   - process.on → IO (signal handling)
#   - <obj>.write / writeErr → IO (stdout/stderr output)
#   - Buffer usage → PURE (string encoding)

commander:
  # Command class — core API
  Command.new: [PURE]
  Command.name:        # setter — mutates this
    effects: [MUTATION]
    returns:
      type: Command
  Command.description:
    effects: [MUTATION]
    returns:
      type: Command
