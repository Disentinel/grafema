    returns:
      type: Command
  Command.configureHelp:
    effects: [MUTATION]
    returns:
      type: Command
  Command.showHelpAfterError:
    effects: [MUTATION]
    returns:
      type: Command
  Command.showSuggestionAfterError:
    effects: [MUTATION]
    returns:
      type: Command
  Command.configureOutput:
    effects: [MUTATION]
    returns:
