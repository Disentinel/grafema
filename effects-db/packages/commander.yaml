    returns:
      type: Command
  Command.addArgument:
    effects: [MUTATION]
    returns:
      type: Command
  Command.command:      # registers subcommand
    effects: [MUTATION]
    args:
      - index: 0
        role: COMMAND_NAME
    returns:
      type: Command
  Command.addCommand:
    effects: [MUTATION]
    args:
      - index: 0
        role: COMMAND_NAME
    returns:
      type: Command
  Command.action:       # registers handler
    effects: [MUTATION]
