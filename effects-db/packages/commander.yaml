  Command.combineFlagAndOptionalValue:
    effects: [MUTATION]
    returns:
      type: Command
  Command.storeOptionsAsProperties:
    effects: [MUTATION]
    returns:
      type: Command

  # Execution — IO (reads process.argv, writes stdout/stderr, may call process.exit)
  # GRAFEMA FOUND: process.exit (3x), childProcess.spawn (2x), process.on, write/writeErr
  Command.parse: [IO, MUTATION, THROW]        # may call process.exit
  Command.parseAsync: [IO, ASYNC, MUTATION, THROW]
  Command.parseOptions: [MUTATION]
  Command._exit: [IO, THROW]                  # calls process.exit
  Command.executableSubcommand: [IO, ASYNC]    # calls childProcess.spawn

  # Output — IO
  Command.help: [IO]               # writes to stdout
  Command.outputHelp: [IO]
  Command.helpInformation: [PURE]  # returns string, no IO

  # Getters — PURE
  Command.opts: [PURE]
  Command.optsWithGlobals: [PURE]
  Command.getOptionValue: [PURE]
  Command.getOptionValueSource: [PURE]
  Command.setOptionValue: [MUTATION]
  Command.setOptionValueWithSource: [MUTATION]
  Command.args: [PURE]

  # Option class
  Option.new: [PURE]
  Option.default: [MUTATION]
  Option.preset: [MUTATION]
  Option.env: [MUTATION]
  Option.argParser: [MUTATION]
  Option.choices: [MUTATION]
  Option.conflicts: [MUTATION]
  Option.implies: [MUTATION]
  Option.hideHelp: [MUTATION]
  Option.makeOptionMandatory: [MUTATION]

  # Argument class
  Argument.new: [PURE]
