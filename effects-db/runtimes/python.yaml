# Python Effects Database
# Generated: 2026-05-12 (gs-115b, НИИ ЦВК)
# Taxonomy version: 2
#
# Format (v1): module.function: [EFFECT, ...]
# Format (v2): module.function: { effects: [EFFECT, ...], channel: { ... } }
# For class methods: module.ClassName.method: [EFFECT, ...]
#
# Covers HTTP / IPC / process / socket surface needed by gs-115b
# (dpc-messenger Tauri/FastAPI/Python analysis). Not an exhaustive
# Python stdlib map — extend incrementally as new packages surface.
#
# NOTE: EffectsLookup.load() in packages/util/src/manifest/effects-lookup.ts
# currently hardcodes runtimeFiles = ['node.yaml', 'rust.yaml', 'haskell.yaml'].
# To consume this file, add 'python.yaml' to that list (one-line patch).
# The detector plugin (http-ipc-detector.mjs) does NOT depend on
# EffectsLookup — it carries its own pattern map — so the file remains
# useful as documentation and a future-integration target.

