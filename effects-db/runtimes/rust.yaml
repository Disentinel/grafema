# Rust Standard Library Effects Database
# Generated: 2026-04-02
# Taxonomy version: 2
#
# Format: module.function: [EFFECT, ...]
# For methods: module.Type.method
#
# Rust's ownership system prevents many side effects at compile time.
# Most std functions are PURE. IO functions (fs, net, io) have IO effects.
# Panicking functions have THROW.

