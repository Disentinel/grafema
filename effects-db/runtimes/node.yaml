# Node.js Built-in Functions Effects Database
# Generated: 2026-03-15, updated: 2026-03-31
# Method: 3 independent Claude subagent passes, cross-validated
# Taxonomy version: 2
#
# Format (v1): module.function: [EFFECT, ...]
# Format (v2): module.function: { effects: [EFFECT, ...], channel: { ... } }
# For class methods: module.ClassName.method: [EFFECT, ...]
# IO subtypes (v2): IO:FILE:READ, IO:SOCKET:WRITE, IO:PROCESS:SPAWN, etc.
# PURE means no other effects apply.

