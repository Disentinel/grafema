# Autoresearch Question Set v1
#
# Source: Sillito et al. (2006/2008) taxonomy of developer questions.
# Questions phrased as real developers would ask — NOT biased toward tools.
#
# Eval types:
#   set      — exact match (expected == actual, order-independent)
#   superset — all expected items must be present (recall = 1.0)
#   text     — all expected keywords present in answer
#   judge    — LLM judge scores 0-5 (reference_answer used for grading)
#
# Anchors: patterns that must exist in code for question to be valid (staleness check)

questions:
