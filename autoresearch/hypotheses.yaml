# Autoresearch Hypotheses
# Status: untested | confirmed | rejected | inconclusive
# Axis: prompt | graph | tools | model | product

hypotheses:
  # === ROUND 1 (confirmed/partially confirmed) ===

  - id: H001A
    date: "2026-03-24"
    axis: tools
    statement: "Reducing MCP tool count from 30 to 4-5 core tools improves accuracy and reduces token overhead"
    prediction: "Accuracy >= baseline (93%), avg tokens decrease 10%+, MCP adoption stays >= 50%"
    status: incomplete
    evidence: "Remote experiment failed with npm build error. Needs retry."
    branch: "experiment/h001a-reduce-tools"

  - id: H001B
    date: "2026-03-24"
    axis: tools
    statement: "Single swiss-army tool reduces context overhead vs 30 separate tools"
    prediction: "ToolSearch calls drop to 0, tokens decrease 15%+, accuracy unchanged"
    status: partially_confirmed
    evidence: "93.3% accuracy (=baseline), cost $2.37 vs $7.57 (-69%), tokens -20.8%. But MCP=0 in both conditions — agent didn't use MCP at all, so single-tool UX untested."
    branch: "experiment/h001b-single-tool"

  - id: H001C
    date: "2026-03-24"
    axis: tools
    statement: "Pre-loading tool schemas eliminates ToolSearch overhead"
    status: incomplete
    evidence: "Remote experiment still running or incomplete."
    branch: "experiment/h001c-preload-tools"

  - id: H002
    date: "2026-03-24"
    axis: tools
    statement: "Agent prefers Grep over find_calls for call-analysis questions"
    status: confirmed
    evidence: "Q06: find_calls 1x then Grep 6x. Agent supplements MCP with file tools."

  - id: H003
    date: "2026-03-24"
    axis: tools
    statement: "Graph advantage on cat 3 (tracing), not cat 1-2 (structure)"
    status: confirmed
    evidence: "Cat 3: grafema 4.3/5 vs baseline 3.7/5 (+16%). Cat 1-2: baseline 93% vs grafema 87%."

  - id: H004
    date: "2026-03-24"
    axis: graph
    statement: "find_calls returns incomplete results — fixing it restores accuracy"
    status: confirmed
    evidence: "Q06 fixed (0.5→1.0). Reverse CALLS edge lookup. Overall 93.3% = baseline. Cost $3.56."
    branch: "experiment/h004-fix-find-calls"

  - id: H005
    date: "2026-03-24"
    axis: tools
    statement: "get_stats is overhead — removing it saves tokens"
    status: confirmed_with_surprise
    evidence: "get_stats=0 as predicted. BUT MCP adoption dropped 70%→0%. get_stats was bootstrap mechanism. Accuracy 89.5% (held). Cost ~$3.13 (cheaper)."
    branch: "experiment/h005-remove-get-stats"

  # === ROUND 2 (new hypotheses from experiment analysis) ===

  - id: H006
    date: "2026-03-24"
    axis: product
    statement: "MCP value comes from context injection (server instructions describing architecture), not from tool calls"
    prediction: "Context-only mode (MCP with instructions but no tools) achieves accuracy >= grafema-v1 at cost <= baseline"
    metric: accuracy + cost
    status: untested
    evidence: "H005: 0 MCP calls but 89.5% accuracy. H001B: 0 MCP calls but 93.3%. Server instructions present in both. Baseline without instructions: 93%. If context-only matches these → tools are unnecessary."
    change: "MCP config with empty tool list, keep server instructions"
    test: "Critical test. If confirmed → product pivot from 'graph DB for AI' to 'graph-generated AI context'."

  - id: H007
    date: "2026-03-24"
    axis: prompt
    statement: "Explicit tool routing rules ('for call analysis use find_calls, for text search use Grep') improves MCP effectiveness"
    prediction: "MCP usage becomes targeted (only on appropriate questions), accuracy on cat 2 call-analysis questions improves"
    status: untested
    change: "Add routing rules to grafema.md prompt template"

  - id: H008
    date: "2026-03-24"
    axis: tools
    statement: "describe() as pre-reader saves 30%+ tokens on complex questions"
    prediction: "Instruction 'call describe() before reading any file' reduces avg tokens on cat 3 by 30%+"
    status: untested
    change: "Add describe-first instruction to prompt"

  - id: H009
    date: "2026-03-24"
    axis: product
    statement: "Graph-generated codebase profile document (injected as context) beats MCP tools for comprehension tasks"
    prediction: "A 2000-token 'codebase profile' generated by grafema gives accuracy >= MCP tools at near-zero marginal cost"
    status: untested
    evidence: "Server instructions (~500 tokens) already carry most of the value. A richer auto-generated profile should do even better."
    change: "Generate codebase-profile.md from graph analysis, inject into baseline prompt"
    test: "If confirmed → Grafema's product is 'graph analysis → AI-optimized docs', not 'graph DB + MCP tools'."

  - id: H010
    date: "2026-03-24"
    axis: tools
    statement: "Combined H004+H001B+routing instructions beats all individual experiments"
    prediction: "Accuracy > 93%, cost < $3, MCP used on appropriate questions only"
    status: untested
    change: "Merge find_calls fix + single tool + routing instructions"

  - id: H011
    date: "2026-03-24"
    axis: product
    statement: "For SWE-bench bug fixes, context injection matters more than MCP tools"
    prediction: "SWE-bench with codebase profile but no MCP matches grafema-explicit condition (78% resolve, -28% cost)"
    status: untested
    evidence: "Pilot showed grafema-explicit = 78% resolve, -28% cost. If context alone replicates this → tools are overhead for bug-fix tasks too."
    test: "Re-run SWE-bench pilot: baseline vs context-only vs grafema-explicit"
