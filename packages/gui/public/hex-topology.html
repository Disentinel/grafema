<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Grafema — Hex Topology Map</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e14; overflow: hidden; font-family: 'SF Mono', 'Fira Code', monospace; }
    #canvas-container { width: 100vw; height: 100vh; }

    /* Loading overlay */
    #loading {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        background: #0a0e14; z-index: 1000; color: #00e5ff;
        font-size: 18px;
    }

    /* Tooltip */
    #tooltip {
        display: none; position: fixed; z-index: 500;
        background: rgba(10, 14, 20, 0.95); border: 1px solid #00e5ff33;
        color: #ccc; padding: 8px 12px; border-radius: 6px;
        font-size: 12px; pointer-events: none;
        max-width: 350px;
    }
    .tt-type { color: #00e5ff; font-weight: bold; }
    .tt-name { color: #fff; margin: 2px 0; }
    .tt-file { color: #888; font-size: 11px; }
    .tt-degree { color: #aaa; font-size: 11px; margin-top: 4px; }
    .tt-edges { color: #999; font-size: 10px; margin-top: 2px; line-height: 1.4; }

    /* Search */
    #search-box {
        position: fixed; top: 12px; left: 12px; z-index: 300;
    }
    #search-input {
        background: rgba(10, 14, 20, 0.9); border: 1px solid #00e5ff44;
        color: #fff; padding: 8px 12px; border-radius: 6px;
        font-family: inherit; font-size: 13px; width: 260px;
        outline: none;
    }
    #search-input:focus { border-color: #00e5ff; }
    #search-input::placeholder { color: #555; }
    #search-results {
        display: none; background: rgba(10, 14, 20, 0.95);
        border: 1px solid #00e5ff33; border-radius: 6px;
        margin-top: 4px; max-height: 300px; overflow-y: auto;
    }
    .search-item {
        padding: 6px 10px; cursor: pointer; display: flex; gap: 8px;
        align-items: center; font-size: 12px; color: #ccc;
    }
    .search-item:hover, .search-item.selected { background: #00e5ff22; }
    .search-icon { font-size: 14px; }
    .search-name { color: #fff; flex: 1; }
    .search-type { color: #00e5ff; font-size: 10px; }
    .search-file { color: #666; font-size: 10px; }

    /* Active badge */
    #active-badge {
        display: none; position: fixed; top: 52px; left: 12px; z-index: 301;
        background: rgba(10, 14, 20, 0.9); border: 1px solid #00e5ff44;
        padding: 4px 10px; border-radius: 6px; color: #00e5ff;
        font-size: 12px; align-items: center; gap: 6px; cursor: pointer;
    }
    #clear-active {
        background: none; border: none; color: #ff6b6b; cursor: pointer;
        font-size: 14px; padding: 0 4px;
    }

    /* Stats panel */
    #stats-panel {
        position: fixed; bottom: 12px; left: 12px; z-index: 200;
        background: rgba(10, 14, 20, 0.85); border: 1px solid #ffffff11;
        padding: 10px 14px; border-radius: 6px; color: #888;
        font-size: 11px; min-width: 160px;
    }
    .stat-row { display: flex; justify-content: space-between; margin: 2px 0; }
    .stat-row span:last-child { color: #ccc; }

    /* Side panels */
    .side-panel {
        position: fixed; z-index: 200;
        background: rgba(10, 14, 20, 0.9); border: 1px solid #ffffff11;
        padding: 10px; border-radius: 6px; color: #ccc;
        font-size: 11px; max-height: 60vh; overflow-y: auto;
    }
    #edge-panel { right: 12px; top: 12px; width: 220px; }
    #type-panel { left: 12px; top: 90px; width: 200px; }

    .panel-title { color: #00e5ff; font-weight: bold; margin-bottom: 6px; font-size: 12px; }
    .panel-buttons { display: flex; gap: 4px; margin-bottom: 6px; }
    .panel-buttons button {
        background: #ffffff11; border: 1px solid #ffffff22; color: #ccc;
        padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 10px;
    }
    .panel-buttons button:hover { background: #00e5ff22; }

    .edge-type-row, .type-row {
        display: flex; align-items: center; gap: 6px; padding: 2px 0;
    }
    .edge-type-row input, .type-row input { accent-color: #00e5ff; }
    .edge-swatch { width: 10px; height: 10px; border-radius: 2px; }
    .edge-count, .type-count { margin-left: auto; color: #666; }

    .slider-group { margin-top: 8px; border-top: 1px solid #ffffff11; padding-top: 8px; }
    .slider-group label { display: block; margin: 4px 0; color: #888; }
    .slider-group input[type=range] { width: 100%; accent-color: #00e5ff; }

    /* LOD slider */
    #lod-slider {
        position: fixed; bottom: 12px; right: 12px; z-index: 200;
        background: rgba(10, 14, 20, 0.85); border: 1px solid #ffffff11;
        padding: 8px 14px; border-radius: 6px; color: #888; font-size: 11px;
        min-width: 150px;
    }
    #lod-slider label { display: flex; flex-direction: column; gap: 4px; }
    #lod-slider input[type=range] { width: 100%; accent-color: #00e5ff; }
    #lod-value { color: #00e5ff; text-align: center; }
</style>
</head>
<body>

<div id="loading">Loading hex topology...</div>

<div id="canvas-container"></div>

<div id="tooltip"></div>

<div id="search-box">
    <input id="search-input" type="text" placeholder="Search nodes... (Ctrl+K)">
    <div id="search-results"></div>
</div>

<div id="active-badge">
    <span id="active-count">0</span> pinned
    <button id="clear-active">&#x2715;</button>
</div>

<div id="stats-panel"></div>
<div id="edge-panel" class="side-panel"></div>
<div id="type-panel" class="side-panel"></div>
<div id="lod-slider"></div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
    }
}
</script>

<script type="module">
import { CivMap } from './civ-map/CivMap.js';

const map = new CivMap({ container: document.getElementById('canvas-container') });
await map.load('/api/hex-stream');
</script>

</body>
</html>
