[package]
name = "rfdb"
version = "0.3.26"
edition = "2021"
authors = ["Vadim Reshetnikov"]
description = "RFDB (Rega Flow Database) — high-performance disk-backed graph engine for semantic code analysis"
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[dependencies]
# Zero-copy memory mapping
memmap2 = "0.9"

# Cryptographic hashing for deterministic IDs
blake3 = "1.5"

# Parallel iteration
rayon = "1.10"

# System info for memory monitoring
sysinfo = "0.30"

# System calls for prefetch hints (posix_fadvise)
libc = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rmp-serde = "1.3"  # MessagePack for RFDB server protocol

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# WebSocket support (REG-523)
tokio-tungstenite = "0.24"
futures-util = "0.3"

# HTTP server for visualization API
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-br"] }

# UI embedding (feature-gated via `ui`). The `interpolate-folder-path`
# feature lets `#[folder = "$OUT_DIR/ui-dist"]` expand the env var at
# compile time to the absolute path staged by `build.rs`.
rust-embed = { version = "8", optional = true, features = ["interpolate-folder-path"] }

# Channels for worker thread
crossbeam-channel = "0.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Signal handling for graceful shutdown
signal-hook = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Rust source parsing for RustAnalyzer
syn = { version = "2", features = ["full", "parsing", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
regex-lite = "0.1"

# Embedding support (feature-gated)
lancedb = { version = "0.27", optional = true }
arrow-array = { version = "57", optional = true }
arrow-schema = { version = "57", optional = true }
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
hf-hub = { version = "0.5", optional = true }
tokenizers = { version = "0.22", optional = true, features = ["onig"] }
dirs = { version = "5", optional = true }

[features]
default = ["ui"]
# Embed the Grafema GUI (web.html + JS/CSS bundles) into the server binary
# and serve it under /ui/*. Also pulls in the `fs` layer of tower-http for
# any filesystem fallbacks (currently unused, reserved for C14b).
ui = ["dep:rust-embed", "tower-http/fs"]
embedding = [
    "dep:lancedb",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:hf-hub",
    "dep:tokenizers",
    "dep:dirs",
]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"
proptest = "1.4"
# Used by integration tests that spin up the HTTP server and issue real requests.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# neo4j = "0.5"  # TODO: Add when a current neo4j crate becomes available for benchmarks

[[bin]]
name = "rfdb-server"
path = "src/bin/rfdb_server.rs"

[[bin]]
name = "bench_report"
path = "src/bin/bench_report.rs"

[[bench]]
name = "graph_operations"
harness = false

[[bench]]
name = "neo4j_comparison"
harness = false

[[bench]]
name = "reanalysis_cost"
harness = false

[[bench]]
name = "compaction_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Fast iteration profile: ~30s rebuilds vs ~15min for full release.
# Use during development with `cargo build --profile fast`. Binary is
# slightly slower at runtime (no LTO, more codegen units) but the
# trade-off is enormous for the edit/test cycle.
[profile.fast]
inherits = "release"
opt-level = 2
lto = "off"
codegen-units = 16
incremental = true
debug = false

[profile.bench]
inherits = "release"
