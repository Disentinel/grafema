# Grafema Configuration — self-analysis (dogfooding)
# Covers all production source code: TypeScript, Rust, Haskell, Elixir/Erlang

root: ".."

include:
  # TypeScript packages
  - "packages/*/src/**/*.ts"
  # rfdb package uses ts/ not src/
  - "packages/rfdb/ts/**/*.ts"
  # Rust packages (rfdb-server, grafema-orchestrator)
  - "packages/*/src/**/*.rs"
  # Haskell packages (grafema-common, grafema-resolve, haskell-analyzer, haskell-resolve, rust-analyzer, rust-resolve)
  - "packages/*/src/**/*.hs"
  # Elixir/Erlang packages (beam-analyzer)
  - "packages/*/lib/**/*.ex"
  - "packages/*/src/**/*.erl"

# Explicit services: monorepo packages with entry points
services:
  - name: "util"
    path: "packages/util"
    entryPoint: "src/index.ts"
  - name: "cli"
    path: "packages/cli"
    entryPoint: "src/cli.ts"
  - name: "mcp"
    path: "packages/mcp"
    entryPoint: "src/server.ts"
  - name: "types"
    path: "packages/types"
    entryPoint: "src/index.ts"
  - name: "api"
    path: "packages/api"
    entryPoint: "src/index.ts"
  - name: "vscode"
    path: "packages/vscode"
    entryPoint: "src/extension.ts"
  - name: "rfdb"
    path: "packages/rfdb"
    entryPoint: "ts/index.ts"
  - name: "rfdb-server"
    path: "packages/rfdb-server"
    entryPoint: "src/bin/rfdb_server.rs"
  - name: "grafema-orchestrator"
    path: "packages/grafema-orchestrator"
    entryPoint: "src/main.rs"

# method-call-resolver / shape-verifier / axum-route-detector are REPLACED by in-engine
# derive rule packs (@stdlib/method_calls, @stdlib/shape_verifier, @stdlib/axum_routes —
# run by the orchestrator pack-runner after DEPENDS_ON). The old .mjs plugins timed out at
# 60s producing nothing on this graph. semantic-bridge-detector is disabled pending its
# own migration (it also timed out, and its depends_on chain hung off the removed
# axum-route-detector).
plugins:
  - name: "type-inference"
    command: "node plugins/type-inference.mjs"
    mode: batch
    timeout_secs: 600
  - name: "shape-tracker"
    command: "node plugins/shape-tracker.mjs"
    mode: batch
    depends_on:
      - "type-inference"

exclude:
  - "**/*.test.ts"
  - "**/__tests__/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/dist-newstyle/**"
  - "**/target/**"
