# Grafema Guarantees
# Datalog-based guarantees are checked via `grafema check`.
# Integration-test guarantees are verified by their corresponding test files.
#
# Architecture note: namespaced type guarantees are currently centralized here.
# Future: each enricher plugin should declare its own guarantees via plugin manifest
# (see plugin-based guarantees architecture task).

guarantees:

  # ============================================================
  # INTEGRATION TEST GUARANTEES
  # ============================================================

  - name: semantic-id-stability
    description: >
      Semantic IDs must be stable across re-analysis of unchanged code.
      Same source code analyzed twice must produce identical node IDs.
    check: integration-test
    test: test/integration/semantic-id-stability.test.js
    severity: error

  # ============================================================
  # TIER 1: STRUCTURAL CONTAINMENT (ERROR)
  # Every code entity must be connected to its structural parent.
  # A node without a parent is a data quality bug in the analysis
  # pipeline — the node was created but never linked into the tree.
  # ============================================================

  # --- Base types: incoming CONTAINS ---

  - name: function-has-contains
    description: >
      Every FUNCTION node must have at least one incoming CONTAINS edge
      from its parent MODULE or scope.
    check: datalog
    rule: 'violation(X) :- node(X, "FUNCTION"), \+ edge(_, X, "CONTAINS").'
    severity: error

  - name: class-has-contains
    description: >
      Every CLASS node must have an incoming CONTAINS edge
      from its parent MODULE.
    check: datalog
    rule: 'violation(X) :- node(X, "CLASS"), \+ edge(_, X, "CONTAINS").'
    severity: error

  - name: variable-has-contains
    description: >
      Every VARIABLE node must have an incoming CONTAINS or DECLARES edge
      from its parent MODULE, FUNCTION, or SCOPE.
    check: datalog
    rule: 'violation(X) :- node(X, "VARIABLE"), \+ edge(_, X, "CONTAINS"), \+ edge(_, X, "DECLARES").'
    severity: error

  - name: parameter-has-contains
    description: >
      Every PARAMETER node must have an incoming CONTAINS edge
      from its parent FUNCTION.
    check: datalog
    rule: 'violation(X) :- node(X, "PARAMETER"), \+ edge(_, X, "CONTAINS").'
    severity: error

  - name: call-has-contains
    description: >
      Every CALL node must have an incoming CONTAINS edge
      from its parent FUNCTION, MODULE, or SCOPE.
    check: datalog
    rule: 'violation(X) :- node(X, "CALL"), \+ edge(_, X, "CONTAINS").'
    severity: error

  - name: import-has-contains
    description: >
      Every IMPORT node must have an incoming CONTAINS edge
      from its parent MODULE.
    check: datalog
    rule: 'violation(X) :- node(X, "IMPORT"), \+ edge(_, X, "CONTAINS").'
    severity: error

  - name: export-has-contains
    description: >
      Every EXPORT node must have an incoming CONTAINS edge
      from its parent MODULE.
    check: datalog
    rule: 'violation(X) :- node(X, "EXPORT"), \+ edge(_, X, "CONTAINS").'
    severity: error

  - name: expression-has-contains
    description: >
      Every EXPRESSION node must have an incoming CONTAINS edge.
      Even terminal expressions (literals in expressions, operator results)
      are structurally contained by their parent scope or function.
    check: datalog
    rule: 'violation(X) :- node(X, "EXPRESSION"), \+ edge(_, X, "CONTAINS").'
    severity: error

  - name: literal-has-contains
    description: >
      Every LITERAL node must have an incoming CONTAINS edge.
      Even terminal values like 42 or "hello" are contained by
      their parent scope, function, or object literal.
    check: datalog
    rule: 'violation(X) :- node(X, "LITERAL"), \+ edge(_, X, "CONTAINS").'
    severity: error

  - name: loop-has-contains
    description: >
      Every LOOP node must have an incoming CONTAINS edge
      from its parent FUNCTION, MODULE, or SCOPE.
    check: datalog
    rule: 'violation(X) :- node(X, "LOOP"), \+ edge(_, X, "CONTAINS").'
    severity: error

  - name: branch-has-contains
    description: >
      Every BRANCH node (if/switch/ternary) must have an incoming
      CONTAINS edge from its parent FUNCTION, MODULE, or SCOPE.
    check: datalog
    rule: 'violation(X) :- node(X, "BRANCH"), \+ edge(_, X, "CONTAINS").'
    severity: error

  - name: try-has-contains
    description: >
      Every TRY_BLOCK node must have an incoming CONTAINS edge
      from its parent FUNCTION or SCOPE.
    check: datalog
    rule: 'violation(X) :- node(X, "TRY_BLOCK"), \+ edge(_, X, "CONTAINS").'
    severity: error

  - name: property-access-has-contains
    description: >
      Every PROPERTY_ACCESS node must have an incoming CONTAINS edge
      from its parent FUNCTION, MODULE, or SCOPE.
    check: datalog
    rule: 'violation(X) :- node(X, "PROPERTY_ACCESS"), \+ edge(_, X, "CONTAINS").'
    severity: error

  - name: property-assignment-has-contains
    description: >
      Every PROPERTY_ASSIGNMENT node must have an incoming CONTAINS edge
      from its parent FUNCTION, MODULE, or SCOPE.
    check: datalog
    rule: 'violation(X) :- node(X, "PROPERTY_ASSIGNMENT"), \+ edge(_, X, "CONTAINS").'
    severity: error

  - name: side-effect-has-contains
    description: >
      Every SIDE_EFFECT node must have an incoming CONTAINS edge.
      Side effects are always produced inside a function or module.
    check: datalog
    rule: 'violation(X) :- node(X, "SIDE_EFFECT"), \+ edge(_, X, "CONTAINS").'
    severity: error

  # --- Special structural links (non-CONTAINS parent edges) ---

  - name: method-has-class
    description: >
      Every METHOD node must have an incoming HAS_METHOD edge
      from its parent CLASS. A METHOD without a CLASS is orphaned.
    check: datalog
    rule: 'violation(X) :- node(X, "METHOD"), \+ edge(_, X, "HAS_METHOD").'
    severity: error

  - name: case-has-branch
    description: >
      Every CASE node must have an incoming HAS_CASE or HAS_DEFAULT
      edge from its parent BRANCH. A CASE without a BRANCH is orphaned.
    check: datalog
    rule: 'violation(X) :- node(X, "CASE"), \+ edge(_, X, "HAS_CASE"), \+ edge(_, X, "HAS_DEFAULT").'
    severity: error

  - name: catch-has-try
    description: >
      Every CATCH_BLOCK must have an incoming HAS_CATCH edge
      from its parent TRY_BLOCK. A catch without a try is orphaned.
    check: datalog
    rule: 'violation(X) :- node(X, "CATCH_BLOCK"), \+ edge(_, X, "HAS_CATCH").'
    severity: error

  - name: finally-has-try
    description: >
      Every FINALLY_BLOCK must have an incoming HAS_FINALLY edge
      from its parent TRY_BLOCK. A finally without a try is orphaned.
    check: datalog
    rule: 'violation(X) :- node(X, "FINALLY_BLOCK"), \+ edge(_, X, "HAS_FINALLY").'
    severity: error

  - name: scope-has-parent
    description: >
      Every SCOPE node must have at least one incoming structural edge:
      HAS_SCOPE (from function), HAS_BODY (from loop/try),
      HAS_CONSEQUENT or HAS_ALTERNATE (from branch), or CONTAINS
      (from parent scope). A SCOPE without any of these is orphaned.
    check: datalog
    rule: >-
      violation(X) :- node(X, "SCOPE"),
        \+ edge(_, X, "HAS_SCOPE"),
        \+ edge(_, X, "HAS_BODY"),
        \+ edge(_, X, "HAS_CONSEQUENT"),
        \+ edge(_, X, "HAS_ALTERNATE"),
        \+ edge(_, X, "CONTAINS").
    severity: error

  - name: module-has-children
    description: >
      Every MODULE node must have at least one outgoing CONTAINS edge.
      A MODULE without children means the file was indexed but nothing
      was extracted — either the file is empty (should not be indexed)
      or the analysis pipeline failed to extract any entities.
    check: datalog
    rule: 'violation(X) :- node(X, "MODULE"), \+ edge(X, _, "CONTAINS").'
    severity: error

  # --- Namespaced types: structural containment ---
  # Grouped by namespace. Each namespaced node must be CONTAINS'd
  # by its parent FUNCTION or MODULE.

  - name: http-nodes-orphan
    description: >
      Every http:route and http:request node must have an incoming
      CONTAINS edge from its parent FUNCTION or MODULE.
    check: datalog
    rule: |
      violation(X) :- node(X, "http:route"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "http:request"), \+ edge(_, X, "CONTAINS").
    severity: error

  - name: express-nodes-orphan
    description: >
      Every Express.js node (router, middleware, mount) must have
      an incoming CONTAINS edge.
    check: datalog
    rule: |
      violation(X) :- node(X, "express:router"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "express:middleware"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "express:mount"), \+ edge(_, X, "CONTAINS").
    severity: error

  - name: socketio-nodes-orphan
    description: >
      Every Socket.IO node (emit, on, namespace) must have
      an incoming CONTAINS edge.
    check: datalog
    rule: |
      violation(X) :- node(X, "socketio:emit"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "socketio:on"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "socketio:namespace"), \+ edge(_, X, "CONTAINS").
    severity: error

  - name: db-nodes-orphan
    description: >
      Every database node (query, connection) must have
      an incoming CONTAINS edge.
    check: datalog
    rule: |
      violation(X) :- node(X, "db:query"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "db:connection"), \+ edge(_, X, "CONTAINS").
    severity: error

  - name: redis-nodes-orphan
    description: >
      Every Redis operation node must have an incoming CONTAINS edge.
    check: datalog
    rule: |
      violation(X) :- node(X, "redis:read"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "redis:write"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "redis:delete"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "redis:publish"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "redis:subscribe"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "redis:transaction"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "redis:connection"), \+ edge(_, X, "CONTAINS").
    severity: error

  - name: fs-nodes-orphan
    description: >
      Every filesystem operation node must have an incoming CONTAINS edge.
    check: datalog
    rule: |
      violation(X) :- node(X, "fs:read"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "fs:write"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "fs:operation"), \+ edge(_, X, "CONTAINS").
    severity: error

  - name: net-nodes-orphan
    description: >
      Every network node (request, tcp, unix socket) must have
      an incoming CONTAINS edge.
    check: datalog
    rule: |
      violation(X) :- node(X, "net:request"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "net:stdio"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "net:tcp-connection"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "net:tcp-server"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "os:unix-socket"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "os:unix-server"), \+ edge(_, X, "CONTAINS").
    severity: error

  - name: event-nodes-orphan
    description: >
      Every event node (listener, emit) must have an incoming
      CONTAINS edge.
    check: datalog
    rule: |
      violation(X) :- node(X, "event:listener"), \+ edge(_, X, "CONTAINS").
      violation(X) :- node(X, "event:emit"), \+ edge(_, X, "CONTAINS").
    severity: error

  # ============================================================
  # TIER 2: SEMANTIC INTEGRITY (WARNING)
  # Nodes that exist but miss the edge that gives them meaning.
  # The node is structurally connected but semantically hollow —
  # it can't fulfill its purpose without the defining edge.
  # ============================================================

  # DISABLED: External library imports (npm/Hackage/crates.io) intentionally lack
  # IMPORTS_FROM edges — no MODULE node exists for external packages.
  # TODO: Create EXTERNAL_MODULE virtual nodes for external deps (REG-XXX)
  # - name: import-has-source
  #   description: >
  #     Every IMPORT node must have an outgoing IMPORTS_FROM edge
  #     to its source MODULE. Without it, dependency tracing is blind —
  #     we know something is imported but not from where.
  #   check: datalog
  #   rule: 'violation(X) :- node(X, "IMPORT"), \+ edge(X, _, "IMPORTS_FROM").'
  #   severity: warning

  - name: export-has-target
    description: >
      Every EXPORT node must have an outgoing EXPORTS or RE_EXPORTS edge
      to the entity it exports (FUNCTION, VARIABLE, CLASS, etc.).
      Without it, the export is a dead declaration.
    check: datalog
    rule: 'violation(X) :- node(X, "EXPORT"), \+ edge(X, _, "EXPORTS"), \+ edge(X, _, "RE_EXPORTS").'
    severity: warning

  - name: loop-has-body
    description: >
      Every LOOP node must have an outgoing HAS_BODY edge to its
      body SCOPE. Without it, the loop's contents are invisible
      to control flow and data flow analysis.
    check: datalog
    rule: 'violation(X) :- node(X, "LOOP"), \+ edge(X, _, "HAS_BODY").'
    severity: warning

  - name: try-has-handler
    description: >
      Every TRY_BLOCK must have at least one outgoing HAS_CATCH
      or HAS_FINALLY edge. A try without any error handling
      breaks async error flow analysis.
    check: datalog
    rule: 'violation(X) :- node(X, "TRY_BLOCK"), \+ edge(X, _, "HAS_CATCH"), \+ edge(X, _, "HAS_FINALLY").'
    severity: warning

  - name: switch-has-cases
    description: >
      Every switch BRANCH must have at least one outgoing HAS_CASE
      edge. A switch without cases is an empty control structure.
    check: datalog
    rule: 'violation(X) :- node(X, "BRANCH"), attr(X, "name", "switch"), \+ edge(X, _, "HAS_CASE").'
    severity: warning

  - name: if-has-consequent
    description: >
      Every if BRANCH must have an outgoing HAS_CONSEQUENT edge
      to its then-block SCOPE. An if without a then-branch
      means the branch body is invisible to analysis.
    check: datalog
    rule: 'violation(X) :- node(X, "BRANCH"), attr(X, "name", "if"), \+ edge(X, _, "HAS_CONSEQUENT").'
    severity: warning

  - name: call-with-args-has-passes-argument
    description: >
      Every CALL node with argCount > 0 and a resolved CALLS edge
      must have at least one PASSES_ARGUMENT edge. A call that has
      arguments but lacks argument edges means the argument-walking
      code failed to connect them.
    check: datalog
    rule: >-
      violation(X) :- node(X, "CALL"),
        edge(X, _, "CALLS"),
        attr(X, "argCount", A),
        gt(A, 0),
        \+ edge(X, _, "PASSES_ARGUMENT").
    severity: warning

  # --- Namespaced semantic integrity ---

  - name: route-has-handler
    description: >
      Every http:route must have an outgoing ROUTES_TO or HANDLED_BY
      edge to its handler FUNCTION. A route without a handler means
      we know the endpoint exists but can't trace what code runs.
    check: datalog
    rule: 'violation(X) :- node(X, "http:route"), \+ edge(X, _, "ROUTES_TO"), \+ edge(X, _, "HANDLED_BY").'
    severity: warning

  - name: unsafe-dynamic-has-contains
    description: >
      Every UNSAFE_DYNAMIC node must have an incoming CONTAINS edge.
      This ensures unsafe dynamic constructs (eval, exec, getattr, etc.)
      are always traceable to their containing scope.
    check: datalog
    rule: 'violation(X) :- node(X, "UNSAFE_DYNAMIC"), \+ edge(_, X, "CONTAINS").'
    severity: error

  # ============================================================
  # TIER 3: BEAM MESSAGEFLOW FINDINGS (REG-1098)
  # beam-message-findings resolver emits ISSUE nodes with a
  # finding_kind tag for six categories of message-flow problems.
  # These rules surface them through `grafema check`, one rule per
  # kind so projects can enable/disable each category independently
  # via yaml without touching the resolver code.
  #
  # Each rule's severity may be overridden per-project. Defaults
  # below are calibrated for "no false-positive CI failures":
  # real-bug kinds default to warning, visibility-only kinds to info.
  # ============================================================

  - name: beam-heterogeneous-key-type
    description: >
      Handler clauses within a single BEAM module match the same map
      key with literal values of different types (atom vs string vs
      number). One set of clauses is almost certainly dead code —
      the observed failure mode is a publisher that emits string
      values while a subscriber's handler clause matches atoms, or
      vice versa. Statically catches the kami Ichi.Mamori :atom vs
      "str" regression.
    check: datalog
    rule: 'violation(X) :- node(X, "ISSUE"), attr(X, "finding_kind", "heterogeneous_key_type").'
    severity: warning

  - name: beam-silent-handler
    description: >
      A handle_cast/handle_info clause receives a non-trivial tagged
      message but its body has zero function calls — the message is
      silently dropped or triggers only a pure state update. Likely
      intentional for streaming accumulators and nil-guard clauses;
      likely a bug for action messages. Review case-by-case.
    check: datalog
    rule: 'violation(X) :- node(X, "ISSUE"), attr(X, "finding_kind", "silent_handler").'
    severity: warning

  - name: beam-catchall-sink
    description: >
      A `handle_info(_, state)` clause at the end of a handler chain
      silently absorbs any unmatched message. Often an intentional
      noise filter, but worth reviewing whenever new message types
      enter the system — unfamiliar messages routed into the sink
      are invisible in production.
    check: datalog
    rule: 'violation(X) :- node(X, "ISSUE"), attr(X, "finding_kind", "catchall_sink").'
    severity: info

  - name: beam-unreachable-handler
    description: >
      A handler clause's pattern does not unify with any send-site
      message shape targeting this module. Either the handler is
      dead code or the process is addressed dynamically (pid) and
      static analysis is blind to its callers.
    check: datalog
    rule: 'violation(X) :- node(X, "ISSUE"), attr(X, "finding_kind", "unreachable_handler").'
    severity: warning

  - name: beam-unreachable-handler-precise
    description: >
      A MESSAGE_TYPE clause has no incoming precise-reachability edge
      (SENDS_MESSAGE, SELF_SCHEDULE, or PUBLISHES) and is not the
      module's catch-all. After the shape-aware resolvers run, this
      means no statically-resolvable caller can deliver to this clause —
      it is either dead code, driven by dynamic PID / external Port
      input, or reached through a call path that static analysis
      doesn't yet model (e.g. `me = self(); send(me, _)` chains).
      Distinct from `beam-unreachable-handler`, which piggy-backs on
      the older ISSUE-node path from BeamMessageFindings.
    check: datalog
    rule: 'violation(M) :- node(M, "MESSAGE_TYPE"), attr(M, "catchall", "false"), \+ incoming(M, _, "SENDS_MESSAGE"), \+ incoming(M, _, "SELF_SCHEDULE"), \+ incoming(M, _, "PUBLISHES").'
    severity: warning

  - name: beam-orphan-send
    description: >
      A SENDS_TO edge carries a message whose shape does not unify
      with any handler clause in the target module. The message will
      hit the catch-all (if any) or crash the GenServer at runtime.
    check: datalog
    rule: 'violation(X) :- node(X, "ISSUE"), attr(X, "finding_kind", "orphan_send").'
    severity: warning

  - name: beam-topic-mismatch
    description: >
      A Phoenix.PubSub topic has either only broadcasters or only
      subscribers — broadcasts are lost in the void or subscribers
      wait forever for a message that never comes.
    check: datalog
    rule: 'violation(X) :- node(X, "ISSUE"), attr(X, "finding_kind", "topic_mismatch").'
    severity: warning

  - name: beam-handler-self-loop-sends
    description: >
      A handler clause's body contains a call that delivers a message
      back to the same handler clause — a classic `cast`/`call` echo
      that can run a GenServer at 100% CPU until its mailbox floods.
      Detected via MESSAGE_TYPE -[CONTAINS]-> CALL -[SENDS_MESSAGE]->
      same MESSAGE_TYPE. SELF_SCHEDULE is excluded: the tick pattern
      (`Process.send_after(self(), :tick, N)`) is a legitimate
      liveness primitive — audit those with `beam-handler-unguarded-tick`.
    check: datalog
    rule: 'violation(M) :- edge(M, C, "CONTAINS"), edge(C, M, "SENDS_MESSAGE"), node(M, "MESSAGE_TYPE").'
    severity: warning

  - name: beam-handler-self-loop-publishes
    description: >
      A handler clause publishes to a PubSub topic whose subscriber
      set includes the same clause — the handler re-enqueues itself
      through fanout. Classic broadcast-storm pattern. Uses the
      PUBLISHES edge emitted by BeamPubsubDelivery, so it only
      fires when static topic unification says the handler really
      will receive its own message.
    check: datalog
    rule: 'violation(M) :- edge(M, C, "CONTAINS"), edge(C, M, "PUBLISHES"), node(M, "MESSAGE_TYPE").'
    severity: warning

  - name: beam-handler-unguarded-tick
    description: >
      A handler clause issues `Process.send_after(self(), _, _)` /
      `send(self(), _)` (SELF_SCHEDULE) with no BRANCH anywhere in
      its own body — the next tick fires unconditionally. Usually
      intentional for polling loops, but worth flagging: once the
      process is alive it keeps ticking forever, even after its
      downstream consumer is gone, its config is disabled, or its
      subject has been removed. Add a guard
      (`if state.running do schedule_next() end`) to make the
      liveness condition visible.
    check: datalog
    rule: 'has_guard(M) :- edge(M, B, "CONTAINS"), node(B, "BRANCH"). violation(M) :- edge(M, C, "CONTAINS"), edge(C, _, "SELF_SCHEDULE"), node(M, "MESSAGE_TYPE"), \+ has_guard(M).'
    severity: info

  - name: beam-state-guard-never-written
    description: >
      A handler clause reads a state field in a guard position
      (`if state.X do`, `case state.X do`, `case Map.get(state, :X) do`)
      but no handler clause AND no `init/1` ever writes to that
      field. Since the field is never populated, guard branches that
      depend on a truthy / specific value are permanently
      unreachable — the corresponding work path is dead code. Built
      on STATE_FIELD nodes + WRITES_STATE / READS_STATE edges
      emitted by the beam-analyzer StateDFG pass.
    check: datalog
    rule: 'violation(F) :- node(F, "STATE_FIELD"), edge(_, F, "READS_STATE"), \+ edge(_, F, "WRITES_STATE").'
    severity: warning

  - name: beam-state-init-only-gate
    description: >
      A state field is read in a guard position of some handler but
      the only writer is `init/1`. Three shapes are possible, from
      safe to buggy:
      (a) intentional immutable config — the GenServer receives the
          value at start-up and branches on it for all eternity
          (e.g. `state.role`, `state.name`); benign.
      (b) one-shot initialisation — init writes a default and the
          caller expects a handler to later mutate it, but the
          handler implementation is missing; the state stays at its
          init default forever.
      (c) future-feature placeholder — field added with a default,
          consumer exists, but the handler meant to toggle it was
          never wired up.
      Info-level: needs human judgement to classify.
    check: datalog
    rule: 'handler_writes(F) :- edge(M, F, "WRITES_STATE"), node(M, "MESSAGE_TYPE"). violation(F) :- node(F, "STATE_FIELD"), edge(_, F, "READS_STATE"), edge(_, F, "WRITES_STATE"), \+ handler_writes(F).'
    severity: info
